<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="観測シーケンス（配置変更・応答・読取・記録）">
<defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;fill:#202a31} .title{font-size:32px;font-weight:700} .h{font-size:24px;font-weight:700} .l{font-size:19px;font-weight:650} .s{font-size:16px} .xs{font-size:13px} .line{fill:none;stroke:#26343d;stroke-width:4} .thin{fill:none;stroke:#5b6972;stroke-width:2} .center{fill:none;stroke:#6f8795;stroke-width:2;stroke-dasharray:12 7} .hidden{fill:none;stroke:#85939c;stroke-width:2;stroke-dasharray:7 6} .dim{fill:none;stroke:#55646d;stroke-width:2} .part{fill:#e9edf0;stroke:#26343d;stroke-width:3} .dark{fill:#677681;stroke:#26343d;stroke-width:3} .wood{fill:#d9c49d;stroke:#4b4132;stroke-width:3} .lead{fill:#aab1b6;stroke:#303941;stroke-width:3} .glass{fill:#d9edf2;fill-opacity:.7;stroke:#476674;stroke-width:3} .force{fill:none;stroke:#a7493d;stroke-width:5} .motion{fill:none;stroke:#2d6f8a;stroke-width:5;stroke-dasharray:12 7} .read{fill:none;stroke:#c7771a;stroke-width:5} .light{fill:none;stroke:#b79a2c;stroke-width:4;stroke-dasharray:10 6} .box{fill:#fbfbf8;stroke:#74838c;stroke-width:2} .num{fill:#fff;stroke:#202a31;stroke-width:3} .hatch line{stroke:#8b969d;stroke-width:1.5}
</style>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#26343d"/></marker>
<marker id="force" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a7493d"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2d6f8a"/></marker>
<marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c7771a"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#8b969d" stroke-width="2"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#f7f7f3"/>
<text x="800" y="48" class="t title" text-anchor="middle">観測シーケンス（配置変更・応答・読取・記録）</text>

<rect x="35" y="75" width="1530" height="760" rx="12" class="box"/>
<text x="800" y="115" class="t h" text-anchor="middle">観測シーケンス：配置変更から記録まで</text>
<g transform="translate(75,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">1</text><text x="92" y="118" class="t l" text-anchor="middle">大球移動</text><circle cx="55" cy="235" r="35" class="lead"/><circle cx="130" cy="235" r="18" class="dark"/><path d="M55 290 Q92 330 130 290" class="motion" marker-end="url(#blue)"/><text x="92" y="390" class="t s" text-anchor="middle">配置を変える</text></g><path d="M260 395 H285" class="line" marker-end="url(#arr)"/><g transform="translate(290,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">2</text><text x="92" y="118" class="t l" text-anchor="middle">引力作用</text><circle cx="50" cy="235" r="38" class="lead"/><circle cx="130" cy="235" r="20" class="dark"/><path d="M92 235 H118" class="force" marker-end="url(#force)"/><text x="92" y="390" class="t s" text-anchor="middle">小球へ力が働く</text></g><path d="M475 395 H500" class="line" marker-end="url(#arr)"/><g transform="translate(505,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">3</text><text x="92" y="118" class="t l" text-anchor="middle">アーム回転</text><line x1="35" y1="240" x2="150" y2="220" class="line"/><circle cx="92" cy="230" r="12" class="dark"/><path d="M40 300 A70 70 0 0 0 145 300" class="motion" marker-end="url(#blue)"/><text x="92" y="390" class="t s" text-anchor="middle">微小回転・振動</text></g><path d="M690 395 H715" class="line" marker-end="url(#arr)"/><g transform="translate(720,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">4</text><text x="92" y="118" class="t l" text-anchor="middle">ワイヤーねじれ</text><line x1="92" y1="170" x2="92" y2="300" class="line"/><path d="M78 200 Q106 220 78 240 Q106 260 78 280" class="motion"/><line x1="35" y1="300" x2="150" y2="300" class="line"/><text x="92" y="390" class="t s" text-anchor="middle">復元力が生じる</text></g><path d="M905 395 H930" class="line" marker-end="url(#arr)"/><g transform="translate(935,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">5</text><text x="92" y="118" class="t l" text-anchor="middle">読取部移動</text><rect x="50" y="185" width="85" height="100" class="wood"/><line x1="92" y1="160" x2="92" y2="315" class="read"/><path d="M45 330 H140" class="motion" marker-end="url(#blue)"/><text x="92" y="390" class="t s" text-anchor="middle">目盛位置が変わる</text></g><path d="M1120 395 H1145" class="line" marker-end="url(#arr)"/><g transform="translate(1150,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">6</text><text x="92" y="118" class="t l" text-anchor="middle">望遠鏡読取</text><path d="M25 215 h110 l30 20 v45 l-30 20 H25 z" class="glass"/><circle cx="25" cy="258" r="33" class="glass"/><line x1="-5" y1="258" x2="-45" y2="258" class="read"/><text x="92" y="390" class="t s" text-anchor="middle">指定時刻・極値で読む</text></g><path d="M1335 395 H1360" class="line" marker-end="url(#arr)"/><g transform="translate(1365,180)"><rect x="0" y="0" width="185" height="430" rx="12" class="box"/><circle cx="92" cy="55" r="30" class="num"/><text x="92" y="65" class="t h" text-anchor="middle">7</text><text x="92" y="118" class="t l" text-anchor="middle">観測帳記録</text><rect x="38" y="180" width="110" height="145" class="box"/><line x1="55" y1="215" x2="130" y2="215" class="thin"/><line x1="55" y1="245" x2="130" y2="245" class="thin"/><line x1="55" y1="275" x2="115" y2="275" class="thin"/><text x="92" y="390" class="t s" text-anchor="middle">時刻と値を残す</text></g>
<rect x="220" y="655" width="1160" height="110" rx="12" class="box"/><text x="800" y="700" class="t l" text-anchor="middle">同じ配置で複数回読み、配置を反対側へ移して観測を繰り返す</text><path d="M1260 730 H330" class="motion" marker-end="url(#blue)"/><text x="800" y="790" class="t xs" text-anchor="middle">時刻付き直接読取・時刻未記載極値・欠測は原表の記載区分を保って扱う。</text>
</svg>