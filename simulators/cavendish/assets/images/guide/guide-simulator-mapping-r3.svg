<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-label="史実装置・観測記録とシミュレータの対応">
<defs>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;fill:#202a31} .title{font-size:32px;font-weight:700} .h{font-size:24px;font-weight:700} .l{font-size:19px;font-weight:650} .s{font-size:16px} .xs{font-size:13px} .line{fill:none;stroke:#26343d;stroke-width:4} .thin{fill:none;stroke:#5b6972;stroke-width:2} .center{fill:none;stroke:#6f8795;stroke-width:2;stroke-dasharray:12 7} .hidden{fill:none;stroke:#85939c;stroke-width:2;stroke-dasharray:7 6} .dim{fill:none;stroke:#55646d;stroke-width:2} .part{fill:#e9edf0;stroke:#26343d;stroke-width:3} .dark{fill:#677681;stroke:#26343d;stroke-width:3} .wood{fill:#d9c49d;stroke:#4b4132;stroke-width:3} .lead{fill:#aab1b6;stroke:#303941;stroke-width:3} .glass{fill:#d9edf2;fill-opacity:.7;stroke:#476674;stroke-width:3} .force{fill:none;stroke:#a7493d;stroke-width:5} .motion{fill:none;stroke:#2d6f8a;stroke-width:5;stroke-dasharray:12 7} .read{fill:none;stroke:#c7771a;stroke-width:5} .light{fill:none;stroke:#b79a2c;stroke-width:4;stroke-dasharray:10 6} .box{fill:#fbfbf8;stroke:#74838c;stroke-width:2} .num{fill:#fff;stroke:#202a31;stroke-width:3} .hatch line{stroke:#8b969d;stroke-width:1.5}
</style>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#26343d"/></marker>
<marker id="force" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#a7493d"/></marker>
<marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2d6f8a"/></marker>
<marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c7771a"/></marker>
<pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#8b969d" stroke-width="2"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#f7f7f3"/>
<text x="800" y="48" class="t title" text-anchor="middle">史実装置・観測記録とシミュレータの対応</text>

<rect x="35" y="75" width="1530" height="800" rx="12" class="box"/><text x="800" y="115" class="t h" text-anchor="middle">史実装置・観測記録とシミュレータ画面の対応</text>
<rect x="70" y="155" width="560" height="650" rx="12" class="box"/><text x="350" y="195" class="t h" text-anchor="middle">史実側</text>
<g class="t l"><text x="120" y="260">① 大球・小球・水平アーム</text><text x="120" y="355">② 望遠鏡・読取部</text><text x="120" y="450">③ 観測帳（時刻・値・位置）</text><text x="120" y="545">④ 配置変更と観測順序</text><text x="120" y="640">⑤ 集計・比較・保存記録</text></g>
<g class="thin"><line x1="110" y1="285" x2="590" y2="285"/><line x1="110" y1="380" x2="590" y2="380"/><line x1="110" y1="475" x2="590" y2="475"/><line x1="110" y1="570" x2="590" y2="570"/><line x1="110" y1="665" x2="590" y2="665"/></g>
<rect x="970" y="155" width="560" height="650" rx="12" class="box"/><text x="1250" y="195" class="t h" text-anchor="middle">シミュレータ</text>
<g class="t l"><text x="1020" y="260">Motion View</text><text x="1020" y="355">Historical Telescope</text><text x="1020" y="450">Read Record / Waveform</text><text x="1020" y="545">観測工程 / Timeline</text><text x="1020" y="640">Result Summary / PDF / CSV</text></g>
<g class="thin"><line x1="1010" y1="285" x2="1490" y2="285"/><line x1="1010" y1="380" x2="1490" y2="380"/><line x1="1010" y1="475" x2="1490" y2="475"/><line x1="1010" y1="570" x2="1490" y2="570"/><line x1="1010" y1="665" x2="1490" y2="665"/></g>
<path d="M630 250 C760 250,840 250,970 250" class="read" marker-end="url(#orange)"/><path d="M630 345 C760 345,840 345,970 345" class="read" marker-end="url(#orange)"/><path d="M630 440 C760 440,840 440,970 440" class="read" marker-end="url(#orange)"/><path d="M630 535 C760 535,840 535,970 535" class="read" marker-end="url(#orange)"/><path d="M630 630 C760 630,840 630,970 630" class="read" marker-end="url(#orange)"/>
<text x="800" y="735" class="t s" text-anchor="middle">史実の直接記録と再構成表示は区別して扱う</text><text x="800" y="775" class="t xs" text-anchor="middle">画面対応は観測関係を示すもので、史実装置の全構造を一対一で復元するものではない。</text>
</svg>